name: Deploy website
on: 
  push:
    branches: 
      - main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            #This is used to get the code from the current github repository
            - name: Get code
              uses: actions/checkout@v3
            #This is to install dependencies present in package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Lint Code
              run: npm run lint
            - name: Run tests
              run: npm run test
    build:
        runs-on: ubuntu-latest
        steps:
            #This is used to get the code from the current github repository
            - name: Get code
              uses: actions/checkout@v3
            #This is to install dependencies present in package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Build code
              run: npm run build
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy Project
              run: echo "Deploying..."

