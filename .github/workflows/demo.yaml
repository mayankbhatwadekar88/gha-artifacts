name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      #This is used to get the code from the current github repository
      - name: Get code
        uses: actions/checkout@v3
      #This is to install dependencies present in package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            package.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      #This is used to get the code from the current github repository
      - name: Get code
        uses: actions/checkout@v3
      #This is to install dependencies present in package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build code
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist-files
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Display the contents
        run: ls
      - name: Deploy Project
        run: echo "Deploying..."

