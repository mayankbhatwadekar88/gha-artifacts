name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      #This is used to get the code from the current github repository
      - name: Get code
        uses: actions/checkout@v3
      #This is to install dependencies present in package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test


  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish.outputs.script-file }}
    steps:
      #This is used to get the code from the current github repository
      - name: Get code
        uses: actions/checkout@v3
      #This is to install dependencies present in package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build code
        run: npm run build
      - name: Publish JS filename
        id: publish
        run: find dist/assets/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: |
            dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Display the contents
        run: ls
      - name: Display the output value
        run: echo "${{ needs.build.outputs.script-file }}"
      - name: Deploy Project
        run: echo "Deploying..."

